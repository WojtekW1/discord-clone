services:
  - type: web
    name: discord-django
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: daphne config.asgi:application --bind 0.0.0.0 --port $PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: discord-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: discord-redis
          type: redis
          property: connectionString

  - type: redis
    name: discord-redis
    plan: free

databases:
  - name: discord-db
    plan: free
