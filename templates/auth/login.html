{% extends "base.html" %}
{% block title %}Logowanie{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card bg-black text-light border-secondary shadow">
        <div class="card-body p-4">
          <h3 class="mb-3">Logowanie</h3>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Login</label>
              <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Hasło</label>
              <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
            </div>
            {% if form.errors %}
              <div class="alert alert-danger py-2">Niepoprawny login lub hasło.</div>
            {% endif %}
            <button class="btn btn-primary w-100">Zaloguj</button>
          </form>
          <div class="mt-3 small text-secondary">
            Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
